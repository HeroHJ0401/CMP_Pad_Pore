name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # 태그 푸시 시 Release 생성에 필요

jobs:
  # ---------------------------------------------------------------- test
  smoke-test:
    name: Algorithm smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-image Pillow
      - name: Run pipeline on a synthetic image
        run: python tests/smoke_test.py

  # --------------------------------------------------------------- build
  build:
    name: Build ${{ matrix.label }}
    needs: smoke-test
    runs-on: ${{ matrix.os }}
    # A windowed build that pops an error dialog would otherwise hang the
    # runner until the 6-hour default limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe)
            artifact: CMP_PoreAnalyzer-windows
            upload_path: dist/CMP_PoreAnalyzer.exe
            release_path: dist/CMP_PoreAnalyzer.exe
          - os: macos-14            # Apple Silicon (arm64)
            label: macOS arm64 (.app)
            artifact: CMP_PoreAnalyzer-macos-arm64
            upload_path: dist/CMP_PoreAnalyzer-macos-arm64.zip
            release_path: dist/CMP_PoreAnalyzer-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name CMP_PoreAnalyzer
          --osx-bundle-identifier com.cmp.poreanalyzer
          --collect-all skimage
          --collect-all tkinterdnd2
          --hidden-import PIL._tkinter_finder
          --exclude-module matplotlib
          --exclude-module pytest
          --exclude-module IPython
          main.py

      # `timeout` matters: a windowed build that hits an unhandled error pops a
      # modal dialog nobody can dismiss on a runner, and the step would hang
      # until the job limit. Kill it and judge the run by the CSV it produced.
      - name: Verify the build runs (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -x
          python tests/make_sample.py sample.png

          # First unfrozen, to tell "the code is broken" apart from
          # "freezing it broke it". This one must succeed outright.
          python main.py --cli sample.png --csv src.csv
          test -f src.csv || { echo "FAIL: source run produced no CSV"; exit 1; }

          timeout 120 ./dist/CMP_PoreAnalyzer.exe --cli sample.png --csv out.csv > exe.log 2>&1
          code=$?
          echo "exe exit code: $code  (124 = killed after 120 s, i.e. it hung)"
          echo "--- exe output ---"; cat exe.log || true; echo "--- end ---"
          test -f out.csv || { echo "FAIL: frozen exe produced no CSV"; exit 1; }
          head -2 out.csv

      - name: Verify the build runs (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          python tests/make_sample.py sample.png
          timeout 120 ./dist/CMP_PoreAnalyzer.app/Contents/MacOS/CMP_PoreAnalyzer \
            --cli sample.png --csv out.csv \
            || echo "app exited non-zero or was killed after 120 s"
          test -f out.csv || { echo "FAIL: CLI run produced no CSV"; exit 1; }
          head -2 out.csv

      - name: Package .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # -y keeps the symlinks inside the bundle intact; a plain artifact
        # upload would otherwise strip them and the executable bit.
        run: |
          cd dist
          zip -qry CMP_PoreAnalyzer-macos-arm64.zip CMP_PoreAnalyzer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          retention-days: 90

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_path }}
          generate_release_notes: true
