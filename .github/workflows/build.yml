name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # 태그 푸시 시 Release 생성에 필요

jobs:
  # ---------------------------------------------------------------- test
  smoke-test:
    name: Algorithm smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-image Pillow
      - name: Run pipeline on a synthetic image
        run: python tests/smoke_test.py

  # --------------------------------------------------------------- build
  build:
    name: Build ${{ matrix.label }}
    needs: smoke-test
    runs-on: ${{ matrix.os }}
    # A windowed build that pops an error dialog would otherwise hang the
    # runner until the 6-hour default limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe)
            artifact: CMP_PoreAnalyzer-windows
            upload_path: dist/CMP_PoreAnalyzer.exe
            release_path: dist/CMP_PoreAnalyzer.exe
          - os: macos-14            # Apple Silicon (arm64)
            label: macOS arm64 (.app)
            artifact: CMP_PoreAnalyzer-macos-arm64
            upload_path: dist/CMP_PoreAnalyzer-macos-arm64.zip
            release_path: dist/CMP_PoreAnalyzer-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          # PyInstaller's splash covers the seconds a onefile build spends
          # unpacking itself, before Python starts. It is Windows/Linux only:
          # passing it on macOS fails the build, so it is added per-OS.
          ARGS=(--noconfirm --clean --onefile --windowed
                --name CMP_PoreAnalyzer
                --osx-bundle-identifier com.cmp.poreanalyzer
                --collect-all skimage
                --collect-all tkinterdnd2
                --hidden-import PIL._tkinter_finder
                --exclude-module matplotlib
                --exclude-module pytest
                --exclude-module IPython)
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARGS+=(--splash splash.png)
          fi
          echo "pyinstaller ${ARGS[*]} main.py"
          pyinstaller "${ARGS[@]}" main.py

      # `timeout` matters: a windowed build that hits an unhandled error pops a
      # modal dialog nobody can dismiss on a runner, and the step would hang
      # until the job limit. Kill it and judge the run by the CSV it produced.
      # run_timeout.py rather than the `timeout` command: macOS does not ship
      # one. It never fails the step itself, so the log always shows what the
      # program actually printed; the CSV check below is what decides.
      - name: Verify the build runs
        timeout-minutes: 6
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tests/make_sample.py sample.png

          if [ "$RUNNER_OS" = "Windows" ]; then
            APP=./dist/CMP_PoreAnalyzer.exe
          else
            APP=./dist/CMP_PoreAnalyzer.app/Contents/MacOS/CMP_PoreAnalyzer
          fi
          echo "app under test: $APP"
          ls -l "$APP" || { echo "FAIL: the build produced no executable"; exit 1; }

          echo "=================== unfrozen (python main.py) ==================="
          python tests/run_timeout.py 120 python main.py --cli sample.png --csv src.csv

          echo "=================== frozen (packaged app) ======================"
          python tests/run_timeout.py 120 "$APP" --cli sample.png --csv out.csv

          echo "=================== verdict ===================================="
          src_ok=0; out_ok=0
          [ -f src.csv ] && src_ok=1
          [ -f out.csv ] && out_ok=1
          echo "source run wrote a CSV : $src_ok"
          echo "packaged run wrote CSV : $out_ok"

          if [ "$src_ok" = "0" ]; then
            echo "FAIL: the code itself does not run on this OS — see the unfrozen output above."
            exit 1
          fi
          if [ "$out_ok" = "0" ]; then
            echo "FAIL: the code runs but the packaged app does not — a packaging problem."
            exit 1
          fi
          head -2 out.csv

      - name: Package .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # -y keeps the symlinks inside the bundle intact; a plain artifact
        # upload would otherwise strip them and the executable bit.
        run: |
          cd dist
          zip -qry CMP_PoreAnalyzer-macos-arm64.zip CMP_PoreAnalyzer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          retention-days: 90

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_path }}
          generate_release_notes: true
